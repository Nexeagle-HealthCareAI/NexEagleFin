<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record an expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column">
<header style="padding: 12px 12px 8px; display: flex; align-items: center; gap: 4px">
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Record expense</h1>
</header>
<main style="flex: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 16px">
<div style="height: 132px; border: 1.5px dashed #94A3B8; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21z"></path><path d="M10 8h4M10 12h4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500">Bill photo attached</span>
<span style="font-size: 13px; color: #475569">Amount and vendor read from it</span>
</div>
</div>
<button type="button" style="height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 12px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #0F172A">Retake</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="amount" style="font-size: 13px; font-weight: 500; color: #475569">Amount</label>
<input id="amount" type="text" inputmode="decimal" value="₹4,850" style="height: 64px; box-sizing: border-box; border: 1px solid #CBD5E1; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 600; color: #0F172A">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="vendor" style="font-size: 13px; font-weight: 500; color: #475569">Paid to</label>
<input id="vendor" type="text" value="Shree Medical Gases" style="height: 48px; box-sizing: border-box; border: 1px solid #CBD5E1; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 500 16px Inter, sans-serif; color: #0F172A">
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: #475569">What for</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="height: 44px; padding: 0 14px; border: 2px solid #1D4ED8; border-radius: 22px; background: #DBEAFE; font: 600 14px Inter, sans-serif; color: #1E3A8A">Medical supplies</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 22px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #0F172A">Maintenance</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 22px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #0F172A">Utilities</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 22px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #0F172A">Marketing</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 22px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #0F172A">Not sure</button>
</div>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="unit" style="font-size: 13px; font-weight: 500; color: #475569">Unit</label>
<select id="unit" style="height: 48px; border: 1px solid #CBD5E1; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font: 500 15px Inter, sans-serif; color: #0F172A">
<option>Hospital</option>
<option>Diagnostics</option>
<option>Path lab</option>
<option>Pharmacy</option>
</select>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #475569">Status</legend>
<div style="height: 48px; box-sizing: border-box; border: 1px solid #CBD5E1; border-radius: 12px; background: #FFFFFF; padding: 3px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
<button type="button" aria-pressed="true" style="border: 0; border-radius: 9px; background: #0F172A; font: 600 14px Inter, sans-serif; color: #FFFFFF">Paid</button>
<button type="button" aria-pressed="false" style="border: 0; border-radius: 9px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #0F172A">To pay</button>
</div>
</fieldset>
</div>
</main>
<footer style="padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 4px">
<button type="button" style="height: 56px; border: 0; border-radius: 16px; background: #1D4ED8; font: 600 17px Inter, sans-serif; color: #FFFFFF">Save</button>
<button type="button" style="height: 44px; border: 0; background: none; font: 500 15px Inter, sans-serif; color: #1D4ED8">Save now, sort later</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

return {};
}
}
</script>
</body>
</html>
